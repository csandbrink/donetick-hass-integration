complete_task:
  name: Complete Task
  description: Complete a Donetick task with optional user attribution
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to complete
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID who completed the task (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

complete_chore:
  name: Complete Chore (Full API)
  description: >-
    Complete a Donetick chore and record the circle member who actually did it.
    The configured API token must belong to a circle admin or manager. Anyone
    who may call this service in Home Assistant can therefore record
    completions for any circle member. For private chores the token owner
    cannot complete, provide assigned_to so Donetick can authorize the
    completion as that member; completed_by remains the actual performer.
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the chore to complete.
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick circle member who actually completed the chore.
      required: true
      selector:
        number:
          min: 1
          mode: box
    assigned_to:
      name: Assigned To User ID
      description: >-
        Optional circle member allowed to complete the chore, usually its
        assignee. Only needed for private chores the token owner cannot
        complete. The integration uses this ID only to authorize the Full-API
        completion as that member; it does not replace completed_by.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific loaded Donetick integration to use.
      required: false
      selector:
        text:

create_task:
  name: Create Task
  description: Create a new Donetick task
  fields:
    name:
      name: Task Name
      description: The name of the task
      required: true
      selector:
        text:
    description:
      name: Description
      description: Task description (optional)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: Task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    created_by:
      name: Created By User ID
      description: The Donetick circle member who creates and is assigned the task (optional; defaults to the API token owner)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

create_chore:
  name: Create Chore (Full API)
  description: Create a Donetick chore with recurrence, assignment strategy, and priority
  fields:
    name:
      name: Chore Name
      description: The name of the chore
      required: true
      selector:
        text:
    description:
      name: Description
      description: Chore description (optional)
      required: false
      selector:
        text:
          multiline: true
    next_due_date:
      name: Next Due Date
      description: Next due date in RFC3339 format
      required: false
      selector:
        text:
    frequency_type:
      name: Frequency Type
      description: How the chore repeats
      required: false
      default: once
      selector:
        select:
          options:
            - once
            - daily
            - weekly
            - monthly
            - yearly
            - adaptive
            - interval
            - days_of_the_week
            - day_of_the_month
            - trigger
            - no_repeat
    frequency:
      name: Frequency
      description: Repeat interval, or day number for day_of_the_month
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    frequency_metadata:
      name: Frequency Metadata
      description: Donetick metadata such as days, months, unit, time, and timezone
      required: false
      selector:
        object:
    assignee_ids:
      name: Assignee User IDs
      description: >-
        List of Donetick user IDs eligible for assignment. Each ID must be an
        active member of the circle; unknown IDs are rejected.
      required: false
      selector:
        object:
    assigned_to:
      name: Assigned To User ID
      description: >-
        Donetick user ID currently assigned to the chore. Must be an active
        member of the circle; unknown IDs are rejected.
      required: false
      selector:
        number:
          min: 1
          mode: box
    assign_strategy:
      name: Assignment Strategy
      description: Strategy used to select the next assignee; inferred when omitted
      required: false
      selector:
        select:
          options:
            - no_assignee
            - least_assigned
            - least_completed
            - random
            - keep_last_assigned
            - random_except_last_assigned
            - round_robin
    priority:
      name: Priority
      description: Donetick priority value
      required: false
      default: 0
      selector:
        number:
          mode: box
    is_rolling:
      name: Rolling Schedule
      description: Schedule the next occurrence relative to completion
      required: false
      selector:
        boolean:
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

update_task:
  name: Update Task
  description: Update an existing Donetick task. Archived tasks remain archived unless Force Unarchive is enabled.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to update
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Task Name
      description: The new name of the task (optional)
      required: false
      selector:
        text:
    description:
      name: Description
      description: New task description (optional, empty string to clear)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: New task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    force_unarchive:
      name: Force Unarchive
      description: Reactivate this task if it is archived (optional; defaults to false)
      required: false
      default: false
      selector:
        boolean:
    assigned_to:
      name: Assignee User ID
      description: Assign to an eligible Donetick user ID, or use null in YAML for Anyone. Switching to or from Anyone requires task edit permission.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

skip_task:
  name: Skip Task
  description: Skip a recurring task, advancing to the next scheduled occurrence without recording a completion
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to skip
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID to attribute the skip to (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

delete_task:
  name: Delete Task
  description: Delete a Donetick task
  fields:
    task_id:
      name: Task ID
      description: The ID of the task to delete
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

complete_assigned_task:
  name: Complete as assigned user
  description: Complete a task using an explicit performer, optional HA user mapping, or its current assignee. Without an override, Anyone tasks credit the API token owner.
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed by Donetick user
      description: >-
        Credit the completion to this Donetick user, overriding optional HA
        user mapping and the current assignee. Donetick applies its own completion rules, which
        depend on the task's privacy, its assignment and its project, and
        rejects anyone it does not accept; the action then fails, carrying
        Donetick's own reason where it gives one.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:
postpone_task:
  name: Reschedule task
  description: Use Donetick's scheduler to skip to the next occurrence without completing the task.
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:

delete_history:
  name: Delete History Entry
  description: Delete one history entry of a Donetick task, e.g. to undo a completion. Use with the history_id returned by complete_task; restore the previous due date with update_task.
  fields:
    task_id:
      name: Task ID
      description: The ID of the task the history entry belongs to
      required: true
      selector:
        number:
          min: 1
          mode: box
    history_id:
      name: History Entry ID
      description: The ID of the history entry to delete
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:
