name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-24.04"
    strategy:
      matrix:
        python-version: ["3.12.15", "3.13.16", "3.14.6"]
    steps:
      - name: Check out repository
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
      - name: Install uv
        uses: "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e" # v6
        with:
          enable-cache: true
      - name: Install Python
        run: "uv python install ${{ matrix.python-version }}"
      - name: Install dependencies
        run: "uv sync --frozen --dev --python ${{ matrix.python-version }}"
      - name: Run tests
        run: "uv run --frozen --python ${{ matrix.python-version }} pytest"

  test-card:
    runs-on: "ubuntu-24.04"
    steps:
      - name: Check out repository
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
      - name: Install Node.js
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020" # v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_user_card.mjs
        env:
          TZ: Europe/Brussels
      # Own process: the test replaces the customElements/HTMLElement/window globals.
      - run: node --experimental-default-type=module tests/test_frontend_startup.mjs
      - run: npm install --prefix "$RUNNER_TEMP/donetick-card-tests" --no-package-lock happy-dom@20.14.5
      - run: node --experimental-default-type=module tests/test_user_card_dom.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_editor.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_completed_card.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_updates.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_initials.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js

  validate-hacs:
    runs-on: "ubuntu-24.04"
    steps:
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa" # main
        with:
          category: "integration"
