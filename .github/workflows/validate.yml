name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:

jobs:
  test:
    runs-on: "ubuntu-24.04"
    steps:
      - name: Check out repository
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
      - name: Install uv
        uses: "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e" # v6
        with:
          enable-cache: true
      - name: Install Python
        run: "uv python install 3.11.15"
      - name: Install dependencies
        run: "uv sync --frozen --dev --python 3.11.15"
      - name: Run tests
        run: "uv run --frozen pytest"

  test-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_user_card.mjs
        env:
          TZ: Europe/Brussels
      # Own process: the test replaces the customElements/HTMLElement/window globals.
      - run: node --experimental-default-type=module tests/test_frontend_startup.mjs
      - run: npm install --prefix "$RUNNER_TEMP/donetick-card-tests" --no-package-lock happy-dom@20.14.5
      - run: node --experimental-default-type=module tests/test_user_card_dom.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_editor.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_completed_card.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_updates.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
