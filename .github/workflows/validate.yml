name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-24.04"
    strategy:
      matrix:
        python-version: ["3.11.15", "3.13.16", "3.14.6"]
    steps:
      - name: Check out repository
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
      - name: Install uv
        uses: "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e" # v6
        with:
          enable-cache: true
      - name: Install Python
        run: "uv python install ${{ matrix.python-version }}"
      - name: Install dependencies
        run: "uv sync --frozen --dev --python ${{ matrix.python-version }}"
      - name: Run tests
        run: "uv run --frozen --python ${{ matrix.python-version }} pytest"

  validate-hacs:
    runs-on: "ubuntu-24.04"
    steps:
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa" # main
        with:
          category: "integration"
